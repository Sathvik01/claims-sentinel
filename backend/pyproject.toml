[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.44.0",
    "fastapi>=0.162.0",
    "langchain-groq>=1.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-multipart>=0.0.32",
    "rapidfuzz>=3.14.6",
    "reportlab>=5.1.0",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: loads the full synthetic dataset"]
